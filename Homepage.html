<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>COSMIC 🐱 - Homepage</title>
        <link rel="stylesheet" href="CSS-All.css">
        <link rel="stylesheet" href="CSS-Homepage.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body style="overflow-y: auto;">     
        <header class="encabezado-sitio">
            <div class="contenedor-logo"> 
                <a href="Homepage.html"><img src="logo.jpeg" alt="COSMIC" class="logo-redondo"></a>
                <span class="nombre-sitio">COSMIC</span>
            </div>   
            <nav class="navegacion-principal">
                <a href="Homepage.html" class="enlace-nav">Inicio</a>
                <a href="#populares" class="enlace-nav">Populares</a>
                <div class="desplegable">
                    <button type="button" class="enlace-nav boton-desplegable" onclick="toggleCategorias()">Categorías <i class="fa-solid fa-chevron-down"></i></button>
                    <div id="dropdown-categorias" class="menu-desplegable">
                        <a href="#scifi">🤖 Sci-Fi / Cyberpunk</a>
                        <a href="#shonen">🔥 Shonen / Acción</a>
                        <a href="#fantasia">🐉 Fantasía</a>
                        <a href="#terror">👻 Terror / Misterio</a>
                        <a href="#romance">💖 Romance / Slice of Life</a>
                        <a href="#seinen">⚔️ Seinen</a>
                    </div>
                </div>
            </nav>
        </header>
        <main>
    
    <section id="populares" class="carrusel-populares">
        
        <button type="button" class="flecha" onclick="moverCarrusel(-1)">◀</button>
        <div class="contenedor-portada">
        
            <img id="portada-img" src="gato-ciudad.jpg" alt="Popular">
        </div>
        <button type="button" class="flecha" onclick="moverCarrusel(1)">▶</button>
    </section>

    
    <section id="scifi" class="seccion-comics">
        <h2>🤖 Sci-Fi / Cyberpunk</h2>
        <div class="grid-comics">
            <div class="comic-card"><img src="gato-ciudad.jpg" alt="Cyber Cat Vol. 1"></div>
            <div class="comic-card"><img src="gato-ciudad.jpg" alt="Cyber Cat Vol. 2"></div>
            <div class="comic-card"><img src="gato-ciudad.jpg" alt="Cyber Cat Vol. 3"></div>
        </div>
    </section>

    <section id="shonen" class="seccion-comics">
        <h2>🔥 Shonen / Acción</h2>
        <div class="grid-comics">
            <div class="comic-card">Próximamente</div>
            <div class="comic-card">Próximamente</div>
            <div class="comic-card">Próximamente</div>
        </div>
    </section>
    
</main>
       <script>
    function toggleCategorias() {
        document.getElementById("dropdown-categorias").classList.toggle("mostrar");
    }

    window.onclick = function (event) {
        if (!event.target.closest('.boton-desplegable')) {
            document.querySelectorAll(".menu-desplegable.mostrar")
                .forEach(m => m.classList.remove("mostrar"));
        }
    };

    // Carrusel
    const populares = ["gato-ciudad.jpg", "logo.jpeg"]; 
    let actual = 0;
    function moverCarrusel(dir) {
        actual = (actual + dir + populares.length) % populares.length;
        document.getElementById("portada-img").src = populares[actual];
    }
</script>
    </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC 🐱</title>
    <link rel="stylesheet" href="CSS-All.css">
</head>
<body>

    <header class="encabezado-sitio">
        <div class="contenedor-logo">
            <img src="logo.jpg" alt="Logo COSMIC" class="logo-redondo">
            <span class="nombre-sitio">COSMIC</span>
        </div>
        <nav class="navegacion-principal">
            <a href="#" class="enlace-nav">Inicio</a>
            <a href="#" class="enlace-nav">Populares</a>
            <button class="boton-desplegable">Categorías</button>
            <button id="btn-tema">☀ Modo Claro</button>
        </nav>
        <div class="opciones-derecha">
            <a href="#" class="boton-iniciar">Iniciar sesión</a>
        </div>
    </header>

    <main class="contenedor-login">
        <div class="tarjeta-login">
            <h1>Bienvenido</h1>
            <form>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" placeholder="tu@correo.com" required>
                <button type="submit" class="boton-colorful" style="margin-top: 20px;">
                    <span>Iniciar sesión</span>
                </button>
            </form>
        </div>
    </main>

</body>
</html>
